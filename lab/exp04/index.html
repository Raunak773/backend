<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">MySite</a>
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container my-4">
    <div class="p-5 mb-4 bg-light rounded"><h1>Bootstrap Demo</h1><p>Responsive grid, cards, form and buttons.</p></div>
    <div class="row g-3">
      <div class="col-12 col-md-4"><div class="card"><div class="card-body"><h5>Card 1</h5><button class="btn btn-primary">Go</button></div></div></div>
      <div class="col-12 col-md-4"><div class="card"><div class="card-body"><h5>Card 2</h5><button class="btn btn-success">Go</button></div></div></div>
      <div class="col-12 col-md-4"><div class="card"><div class="card-body"><h5>Card 3</h5><button class="btn btn-danger">Go</button></div></div></div>
    </div>
    <form class="mt-4">
      <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control"></div>
      <button class="btn btn-dark">Submit</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
