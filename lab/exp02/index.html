<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>CSS Types</title>
  <link rel="stylesheet" href="external.css">          <!-- External -->
  <style>                                              /* Internal */
    .internal { color: darkgreen; font-size: 20px; }
  </style>
</head>
<body>
  <h1 style="color:crimson;">Inline CSS heading</h1>
  <p class="internal">Internal CSS paragraph.</p>
  <p class="external">External CSS paragraph.</p>
</body>
</html>
