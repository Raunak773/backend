<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responsive Page</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    header, footer { background: #333; color: #fff; padding: 15px; text-align: center; }
    nav { display: flex; background: #555; }
    nav a { color: #fff; padding: 12px; text-decoration: none; flex: 1; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; padding: 15px; }
    .card { background: #e8eef7; padding: 20px; border-radius: 8px; }
    img { max-width: 100%; }
    @media (max-width: 768px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } nav { flex-direction: column; } }
  </style>
</head>
<body>
  <header><h1>Responsive Layout</h1></header>
  <nav><a href="#">Home</a><a href="#">About</a><a href="#">Contact</a></nav>
  <div class="grid">
    <div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div>
    <div class="card">Card 4</div><div class="card">Card 5</div><div class="card">Card 6</div>
  </div>
  <footer>Resize the window to see the layout change</footer>
</body>
</html>
