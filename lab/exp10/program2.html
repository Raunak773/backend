<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>jQuery 2 - Todo & AJAX</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script></head>
<body>
<h2>Todo list</h2>
<input id="task" placeholder="New task"> <button id="add">Add</button>
<ul id="list"></ul>
<button id="load">Load users (AJAX)</button><ul id="users"></ul>
<script>
$(function () {
  $("#add").click(function () {
    const t = $("#task").val().trim();
    if (!t) return alert("Enter a task");
    $("#list").append(`<li>${$("<span>").text(t).html()} <a href="#" class="del">[x]</a></li>`);
    $("#task").val("");
  });
  $("#list").on("click", ".del", function (e) { e.preventDefault(); $(this).parent().fadeOut(300, function () { $(this).remove(); }); });
  $("#list").on("click", "li", function () { $(this).css("text-decoration", "line-through"); });
  $("#load").click(() => $.getJSON("https://jsonplaceholder.typicode.com/users", d =>
    $("#users").html(d.map(u => `<li>${u.name} (${u.email})</li>`).join(""))));
});
</script></body></html>
